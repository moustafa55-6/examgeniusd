<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExamGenius AI</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{colors:{cobalt:'#2F4BFF',mark:'#D6293E',pass:'#14804A'},fontFamily:{serif:['Newsreader','Georgia','serif'],sans:['IBM Plex Sans','system-ui','sans-serif']}}}}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>@media(prefers-reduced-motion:no-preference){.fade{animation:f .35s ease}}@keyframes f{from{opacity:0;transform:translateY(6px)}}</style>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232F4BFF'/%3E%3Cstop offset='1' stop-color='%237C3AED'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='12' fill='url(%23g)'/%3E%3Cpath d='M24 11 7 19l17 8 17-8z' fill='%23fff'/%3E%3Cpath d='M14 24v7c0 2.5 4.5 5 10 5s10-2.5 10-5v-7l-10 4.7z' fill='%23fff' opacity='.9'/%3E%3Ccircle cx='39' cy='33' r='2.5' fill='%23F5B83D'/%3E%3C/svg%3E">
<meta name="description" content="ExamGenius AI turns your lectures into realistic university exams. Created by MOSTAFA ALSHIKH ALI.">
<meta name="theme-color" content="#101A33">
<style>#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 35%,#1b2a66,#0B1226 70%);color:#fff;transition:opacity .6s}
#splash h1{font:700 2rem/1.1 Newsreader,serif;letter-spacing:.18em;margin-top:1rem}#splash p{opacity:.75;font-size:.9rem;margin-top:.5rem}#splash small{display:block;margin-top:2.2rem;color:#F5B83D;letter-spacing:.08em}
#splash .bar{width:180px;height:3px;margin:1.4rem auto 0;background:#ffffff22;border-radius:9px;overflow:hidden}#splash .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#2F4BFF,#F5B83D);border-radius:9px;animation:ld 1.2s ease-in-out infinite}
@keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}@keyframes pop{from{transform:scale(.6);opacity:0}}#splash svg{animation:pop .8s cubic-bezier(.2,1.4,.4,1)}</style>
</head>
<body class="font-sans bg-[#EEF1F6] text-[#101A33] dark:bg-[#0B1226] dark:text-slate-100"><div id="splash"><div><svg width="76" height="76" viewBox="0 0 48 48"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F4BFF"/><stop offset="1" stop-color="#7C3AED"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#sg)"/><path d="M24 11 7 19l17 8 17-8z" fill="#fff"/><path d="M14 24v7c0 2.5 4.5 5 10 5s10-2.5 10-5v-7l-10 4.7z" fill="#fff" opacity=".9"/><path d="M39 21v10" stroke="#F5B83D" stroke-width="2.5" stroke-linecap="round"/><circle cx="39" cy="33" r="2.5" fill="#F5B83D"/></svg>
<h1>EXAMGENIUS AI</h1><p>Powered by Artificial Intelligence</p><div class="bar"><i></i></div><small>Created by MOSTAFA ALSHIKH ALI</small></div></div>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;const T=localStorage;
const api=async(p,o={})=>{const f=o.body instanceof FormData;const r=await fetch('/api'+p,{method:o.method||(o.body?'POST':'GET'),headers:{...(o.body&&!f?{'Content-Type':'application/json'}:{}),...(T.tk?{Authorization:'Bearer '+T.tk}:{})},body:o.body&&!f?JSON.stringify(o.body):o.body});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d};
const cx=(...a)=>a.filter(Boolean).join(' ');
const Card=({className,...p})=><div className={cx('rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-[#111A33] p-5',className)} {...p}/>;
const Btn=({v='p',className,...p})=><button className={cx('rounded-xl px-4 py-2 text-sm font-semibold transition active:scale-95 disabled:opacity-50 focus-visible:outline focus-visible:outline-2 focus-visible:outline-cobalt',v==='p'?'bg-cobalt text-white hover:brightness-110':'border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800',className)} {...p}/>;
const inp='w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-transparent px-3 py-2 text-sm';
const Sel=({opts,...p})=><select {...p} className={inp+' dark:bg-[#111A33]'}>{opts.map(o=><option key={o}>{o}</option>)}</select>;
const H=({children})=><h1 className="font-serif text-3xl font-bold mb-4">{children}</h1>;
const Err=({m})=>m?<p role="alert" className="text-sm text-mark my-2">{m}</p>:null;
function Chart_({type,data,options}){const r=useRef();useEffect(()=>{const c=new Chart(r.current,{type,data,options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},...options}});return()=>c.destroy()},[JSON.stringify(data)]);return <div className="h-60"><canvas ref={r}/></div>}
const ds=(l,d,c='#2F4BFF')=>({labels:l,datasets:[{data:d,borderColor:c,backgroundColor:c+'cc',tension:.3,borderRadius:6}]});
const y100={scales:{y:{min:0,max:100}}};
const Logo=({s=36})=><svg width={s} height={s} viewBox="0 0 48 48" role="img" aria-label="ExamGenius AI logo"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#2F4BFF"/><stop offset="1" stopColor="#7C3AED"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#lg)"/><path d="M24 11 7 19l17 8 17-8z" fill="#fff"/><path d="M14 24v7c0 2.5 4.5 5 10 5s10-2.5 10-5v-7l-10 4.7z" fill="#fff" opacity=".9"/><path d="M39 21v10" stroke="#F5B83D" strokeWidth="2.5" strokeLinecap="round"/><circle cx="39" cy="33" r="2.5" fill="#F5B83D"/></svg>;
const Brand=({light})=><div className="flex items-center gap-2"><Logo/><span className="font-serif text-xl font-bold leading-none">ExamGenius <span className="text-[#F5B83D]">AI</span></span></div>;
const Empty=({t,icon='📄',cta,on})=><div className="text-center py-8"><div className="text-4xl mb-2" aria-hidden>{icon}</div><p className="text-sm opacity-70 max-w-xs mx-auto">{t}</p>{cta&&<Btn className="mt-4" onClick={on}>{cta}</Btn>}</div>;
const Load=()=><div className="grid place-items-center py-20" role="status" aria-label="Loading"><div className="w-10 h-10 rounded-full border-4 border-cobalt/20 border-t-cobalt animate-spin"/></div>;
const Footer=()=><footer className="text-center text-xs opacity-70 py-6">Developed &amp; Designed by MOSTAFA ALSHIKH ALI</footer>;
const bus=[];const toast=(m,t='ok')=>bus.forEach(f=>f({m,t,id:Math.random()}));
function Toasts(){const[l,setL]=useState([]);useEffect(()=>{const f=x=>{setL(a=>[...a,x]);setTimeout(()=>setL(a=>a.filter(y=>y!==x)),4000)};bus.push(f);return()=>bus.splice(bus.indexOf(f),1)},[]);return <div className="fixed bottom-4 right-4 left-4 sm:left-auto z-[60] space-y-2" aria-live="polite">{l.map(x=><div key={x.id} className={cx('fade rounded-xl px-4 py-3 text-sm text-white shadow-lg',x.t==='err'?'bg-mark':'bg-[#101A33] border border-white/10')}>{x.m}</div>)}</div>}
const PROFS=['Easy Professor','Normal Professor','Strict Professor','Expert Professor'];
const dc={count:'10',difficulty:'Medium',duration:'30',language:'English',professor:'Normal Professor',mode:'Timed exam'};
const mkBody=c=>({count:+c.count,difficulty:c.difficulty,duration:+c.duration,language:c.language,professor:c.professor.split(' ')[0],mode:c.mode==='Practice (no timer)'?'practice':'exam'});
function Config({c,setC,counts=['5','10','20','30','50'],durs=['15','30','45','60']}){const k=x=>({value:c[x],onChange:ev=>setC({...c,[x]:ev.target.value})});return <div className="grid grid-cols-2 gap-3 text-sm"><label>Questions<Sel opts={counts} {...k('count')}/></label><label>Difficulty<Sel opts={['Easy','Medium','Hard','University Level']} {...k('difficulty')}/></label><label>Duration (min)<Sel opts={durs} {...k('duration')}/></label><label>Language<Sel opts={['English','Arabic']} {...k('language')}/></label><label className="col-span-2">Professor mode<Sel opts={PROFS} {...k('professor')}/></label><label className="col-span-2">Mode<Sel opts={['Timed exam','Practice (no timer)']} {...k('mode')}/></label></div>}
function Pick({ls,sel,setSel}){return <div className="max-h-56 overflow-auto rounded-xl border border-slate-300 dark:border-slate-700 divide-y divide-slate-200 dark:divide-slate-800">{ls.map(l=><label key={l.id} className="flex gap-3 items-center px-3 py-2 text-sm cursor-pointer"><input type="checkbox" checked={sel.includes(l.id)} onChange={()=>setSel(sel.includes(l.id)?sel.filter(x=>x!==l.id):[...sel,l.id])}/>{l.title}</label>)}</div>}
function useCount(t,ms=1200){const[v,setV]=useState(0);useEffect(()=>{let f,s;const st=x=>{s=s||x;const p=Math.min((x-s)/ms,1);setV(t*(1-Math.pow(1-p,3)));if(p<1)f=requestAnimationFrame(st)};f=requestAnimationFrame(st);return()=>cancelAnimationFrame(f)},[t]);return v}

function Auth({onLogin}){const[m,setM]=useState('login'),[f,setF]=useState({name:'',email:'',password:''}),[e,setE]=useState('');
const go=async ev=>{ev.preventDefault();setE('');try{const d=await api('/'+m,{body:f});T.tk=d.token;onLogin(d.user)}catch(x){setE(x.message)}};
const s=k=>({value:f[k],onChange:ev=>setF({...f,[k]:ev.target.value}),className:inp});
return <div className="min-h-screen flex flex-col items-center justify-center p-4"><Card className="w-full max-w-sm fade"><Brand/><p className="text-sm opacity-70 mt-2 mb-5">Turn your lectures into a real exam.</p>
<form onSubmit={go} className="space-y-3">{m==='register'&&<input placeholder="Full name" required {...s('name')}/>}<input type="email" placeholder="Email" required {...s('email')}/><input type="password" placeholder="Password (8+ characters)" required {...s('password')}/><Err m={e}/><Btn className="w-full">{m==='login'?'Log in':'Create account'}</Btn></form>
<button className="text-sm mt-4 text-cobalt" onClick={()=>{setM(m==='login'?'register':'login');setE('')}}>{m==='login'?'New here? Create an account':'Have an account? Log in'}</button></Card><Footer/></div>}

function Dash({user,go}){const[s,setS]=useState(),[ls,setLs]=useState([]);useEffect(()=>{api('/stats').then(setS);api('/lectures').then(d=>setLs(d.lectures))},[]);
if(!s)return <Load/>;
return <div className="fade space-y-5"><H>Welcome back, {user.name.split(' ')[0]}</H>
<div className="grid grid-cols-2 lg:grid-cols-4 gap-4">{[['Exams completed',s.total],['Average score',s.avg+'%'],['Study hours',s.hours],['Lectures',ls.length]].map(([a,b])=><Card key={a}><p className="text-sm opacity-70">{a}</p><p className="font-serif text-4xl font-bold mt-1">{b}</p></Card>)}</div>
<div className="grid lg:grid-cols-2 gap-4"><Card><h2 className="font-semibold mb-2">Performance</h2>{s.series.length?<Chart_ type="line" data={ds(s.series.map(x=>x.date),s.series.map(x=>x.score))} options={y100}/>:<Empty icon="📈" t="Take an exam to see your trend."/>}</Card>
<Card><h2 className="font-semibold mb-2">Recent results</h2>{s.recent.length?s.recent.map(r=><button key={r.id} onClick={()=>go({n:'result',id:r.id})} className="flex justify-between w-full py-2 border-b border-slate-200 dark:border-slate-800 text-left"><span className="truncate pr-3">{r.title}</span><b className={r.score>=50?'text-pass':'text-mark'}>{r.score}%</b></button>):<Empty icon="📝" t="No results yet."/>}</Card></div>
<Card><div className="flex justify-between mb-2"><h2 className="font-semibold">Your lectures</h2><Btn v="s" onClick={()=>go({n:'lectures'})}>Upload lecture</Btn></div>{ls.length?ls.map(l=><button key={l.id} onClick={()=>go({n:'lecture',id:l.id})} className="flex justify-between w-full py-2 border-b border-slate-200 dark:border-slate-800 text-left"><span>{l.title}</span><span className="opacity-60 text-sm">{l.created.slice(0,10)}</span></button>):<Empty icon="📚" t="Upload your first lecture to generate an exam." cta="Upload lecture" on={()=>go({n:'lectures'})}/>}</Card><p className="text-xs opacity-50 text-center pt-2">Created by MOSTAFA ALSHIKH ALI</p></div>}

function Lectures({go}){const[ls,setLs]=useState([]),[busy,setBusy]=useState(false),[e,setE]=useState('');const load=()=>api('/lectures').then(d=>setLs(d.lectures));useEffect(()=>{load()},[]);
const up=async ev=>{const f=ev.target.files[0];if(!f)return;setBusy(true);setE('');const fd=new FormData();fd.append('file',f);try{const d=await api('/lectures',{body:fd});toast('Lecture analyzed and ready');go({n:'lecture',id:d.id})}catch(x){setE(x.message)}setBusy(false);ev.target.value=''};
return <div className="fade"><H>Lectures</H><Card className="mb-4"><label className="block border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl p-8 text-center cursor-pointer hover:border-cobalt"><p className="font-semibold">{busy?'Reading and analyzing your lecture…':'Choose a PDF, PowerPoint or Word file'}</p><p className="text-sm opacity-60">Text is extracted and analyzed on the server.</p><input type="file" accept=".pdf,.docx,.pptx" className="hidden" onChange={up} disabled={busy}/></label><Err m={e}/></Card>
<Card>{ls.length?ls.map(l=><div key={l.id} className="flex items-center justify-between py-2 border-b border-slate-200 dark:border-slate-800"><button className="text-left" onClick={()=>go({n:'lecture',id:l.id})}><b>{l.title}</b><span className="block text-xs opacity-60">{l.filename}</span></button><Btn v="s" onClick={async()=>{if(confirm('Delete this lecture and its results?')){await api('/lectures/'+l.id,{method:'DELETE'});load()}}}>Delete</Btn></div>):<Empty icon="📚" t="No lectures yet. Upload a PDF, PPTX or DOCX above."/>}</Card></div>}

function Lecture({id,topics,go}){const[l,setL]=useState(),[c,setC]=useState(dc),[busy,setBusy]=useState(false),[e,setE]=useState('');
useEffect(()=>{api('/lectures/'+id).then(d=>setL(d.lecture))},[id]);if(!l)return <Load/>;
const start=async()=>{setBusy(true);setE('');try{const x=await api('/exams',{body:{lecture_id:id,topics,...mkBody(c)}});toast('Your exam is ready. Good luck!');go({n:'exam',exam:x})}catch(z){setE(z.message);setBusy(false)}};
return <div className="fade grid lg:grid-cols-2 gap-4"><Card><H>{l.title}</H><p className="leading-relaxed max-w-prose">{l.summary}</p><h2 className="font-semibold mt-5 mb-2">Topics found</h2><div className="flex flex-wrap gap-2">{l.topics.map(t=><span key={t.name} className="px-3 py-1 rounded-full bg-cobalt/10 text-cobalt text-sm" title={(t.key_points||[]).join(' • ')}>{t.name}</span>)}</div><Btn v="s" className="mt-5" onClick={()=>go({n:'prep',id})}>Exam preparation guide</Btn></Card>
<Card><h2 className="font-serif text-2xl font-bold mb-3">Generate an exam</h2><Config c={c} setC={setC}/>{topics&&<p className="text-sm mt-3 text-cobalt">Focused on: {topics.join(', ')}</p>}<Err m={e}/><Btn className="w-full mt-4" disabled={busy} onClick={start}>{busy?'Writing your exam… this can take a minute':'Start'}</Btn></Card></div>}

function Final({go}){const[ls,setLs]=useState(),[sel,setSel]=useState([]),[c,setC]=useState({...dc,count:'30',duration:'120',professor:'Strict Professor'}),[busy,setBusy]=useState(false),[e,setE]=useState('');
useEffect(()=>{api('/lectures').then(d=>setLs(d.lectures))},[]);if(!ls)return <Load/>;
if(ls.length<2)return <div className="fade"><H>Final exam simulation</H><Card><Empty icon="🎓" t="Upload at least two lectures to combine them into one comprehensive final exam." cta="Upload lectures" on={()=>go({n:'lectures'})}/></Card></div>;
const start=async()=>{setBusy(true);setE('');try{const x=await api('/exams',{body:{lecture_ids:sel,...mkBody(c)}});toast('Final exam ready. Good luck!');go({n:'exam',exam:x})}catch(z){setE(z.message);setBusy(false)}};
return <div className="fade grid lg:grid-cols-2 gap-4"><Card><H>Final exam simulation</H><p className="text-sm opacity-70 mb-3">Pick two or more lectures. Questions are spread evenly across lectures and topics, and your report breaks results down by lecture.</p><Pick ls={ls} sel={sel} setSel={setSel}/><p className="text-sm mt-2">{sel.length} selected</p></Card>
<Card><h2 className="font-serif text-2xl font-bold mb-3">Exam settings</h2><Config c={c} setC={setC} counts={['10','20','30','50']} durs={['60','90','120','180']}/><Err m={e}/><Btn className="w-full mt-4" disabled={busy||sel.length<2} onClick={start}>{busy?'Writing your final exam… this can take a minute':sel.length<2?'Select at least 2 lectures':'Start final exam'}</Btn></Card></div>}

function Weak({go}){const[w,setW]=useState(),[busy,setBusy]=useState(false),[e,setE]=useState('');useEffect(()=>{api('/weakness').then(setW).catch(x=>setE(x.message))},[]);
if(e)return <Err m={e}/>;if(!w)return <Load/>;
if(w.empty)return <div className="fade"><H>Weakness detector</H><Card><Empty icon="🔍" t="Complete an exam and the AI will find the topics where you lose marks." cta="Go to lectures" on={()=>go({n:'lectures'})}/></Card></div>;
const quiz=async()=>{setBusy(true);try{const x=await api('/weakness/quiz',{body:{}});toast('Personalized quiz ready');go({n:'exam',exam:x})}catch(z){setE(z.message);setBusy(false)}};
return <div className="fade space-y-4"><H>Weakness detector</H>{!w.weak.length?<Card><Empty icon="🏆" t="No weak topics found. Every topic is above 60%. Keep it up!"/></Card>:<>
<Card><p className="leading-relaxed max-w-prose">{w.summary}</p><Btn className="mt-4" disabled={busy} onClick={quiz}>{busy?'Building your quiz…':'Generate my personalized practice quiz'}</Btn><Err m={e}/></Card>
<div className="grid lg:grid-cols-2 gap-4"><Card><h2 className="font-semibold mb-2">Topics you miss most</h2><Chart_ type="bar" data={ds(w.weak.map(x=>x.topic.slice(0,24)),w.weak.map(x=>x.pct),'#D6293E')} options={{indexAxis:'y',scales:{x:{min:0,max:100}}}}/></Card>
<Card><h2 className="font-semibold mb-2">Lectures to review</h2>{w.lectures.map(l=><div key={l.id} className="flex justify-between items-center py-2 border-b border-slate-200 dark:border-slate-800"><span>{l.title} <b className="text-mark">{l.mistakes} mistakes</b></span><Btn v="s" onClick={()=>go({n:'lecture',id:l.id})}>Open</Btn></div>)}</Card></div>
<Card><h2 className="font-semibold mb-2">Knowledge gaps</h2>{w.gaps.map(g=><div key={g.topic} className="py-3 border-t border-slate-200 dark:border-slate-800 text-sm"><b>{g.topic}</b><p>{g.gap}</p><p className="text-cobalt">What to review: {g.fix}</p></div>)}</Card></>}</div>}

function Prep({id,go}){const[p,setP]=useState(),[busy,setBusy]=useState(true),[e,setE]=useState('');
const load=r=>{setBusy(true);setE('');api('/lectures/'+id+'/prep'+(r?'?refresh=1':'')).then(d=>{setP(d.prep);r&&toast('Guide refreshed')}).catch(x=>setE(x.message)).finally(()=>setBusy(false))};useEffect(()=>load(),[id]);
if(busy&&!p)return <div><Load/><p className="text-center text-sm opacity-70">Studying your lecture…</p></div>;
return <div className="fade space-y-4"><div className="flex flex-wrap justify-between items-center gap-2"><H>Exam preparation guide</H><div className="flex gap-2"><Btn v="s" onClick={()=>go({n:'lecture',id})}>Back to lecture</Btn><Btn v="s" disabled={busy} onClick={()=>load(1)}>{busy?'Refreshing…':'Regenerate'}</Btn></div></div><Err m={e}/>
<p className="text-sm opacity-70 -mt-2">Ranked by how strongly your lecture emphasizes each idea. This is a revision aid, not a prediction of your actual exam questions.</p>
{p&&p.topics.map(t=><Card key={t.name}><div className="flex flex-wrap justify-between gap-2"><h2 className="font-serif text-xl font-bold">{t.name}</h2><span className={cx('text-xs font-semibold rounded-full px-3 py-1 h-fit',t.emphasis==='high'?'bg-mark/10 text-mark':'bg-amber-400/20 text-amber-600 dark:text-amber-300')}>{t.emphasis==='high'?'Strongly emphasized':'Moderately emphasized'}</span></div>
<p className="text-sm mt-2"><b>Why it matters: </b>{t.why}</p>
{t.definitions?.length>0&&<div className="mt-3 text-sm"><b>Key definitions</b><ul className="list-disc ml-5">{t.definitions.map(d=><li key={d.term}><b>{d.term}:</b> {d.definition}</li>)}</ul></div>}
{t.relationships?.length>0&&<div className="mt-3 text-sm"><b>Important relationships</b><ul className="list-disc ml-5">{t.relationships.map(r=><li key={r}>{r}</li>)}</ul></div>}
{t.practice?.length>0&&<div className="mt-3 text-sm"><b>Practice questions</b>{t.practice.map(q=><details key={q.q} className="my-1"><summary className="cursor-pointer">{q.q}</summary><p className="ml-4 opacity-80">Hint: {q.hint}</p></details>)}</div>}
<Btn v="s" className="mt-3" onClick={()=>go({n:'lecture',id,topics:[t.name]})}>Practice this topic</Btn></Card>)}</div>}

function Battle({go}){const[ls,setLs]=useState(),[sel,setSel]=useState([]),[n,setN]=useState('5'),[sec,setSec]=useState('20'),[code,setCode]=useState(''),[busy,setBusy]=useState(false),[e,setE]=useState('');useEffect(()=>{api('/lectures').then(d=>setLs(d.lectures))},[]);if(!ls)return <Load/>;
const make=async()=>{setBusy(true);setE('');try{const d=await api('/battles',{body:{lecture_ids:sel,count:+n,seconds:+sec}});toast('Room created. Share the code with your friends.');go({n:'room',code:d.code})}catch(x){setE(x.message);setBusy(false)}};
const join=async()=>{setE('');try{const d=await api('/battles/join',{body:{code}});go({n:'room',code:d.code})}catch(x){setE(x.message)}};
return <div className="fade"><H>Study Battle</H><div className="grid lg:grid-cols-2 gap-4"><Card><h2 className="font-serif text-2xl font-bold mb-3">Create a private room</h2>{ls.length?<><Pick ls={ls} sel={sel} setSel={setSel}/><div className="grid grid-cols-2 gap-3 text-sm mt-3"><label>Questions<Sel opts={['3','5','10','15','20']} value={n} onChange={x=>setN(x.target.value)}/></label><label>Seconds per question<Sel opts={['10','15','20','30','45','60']} value={sec} onChange={x=>setSec(x.target.value)}/></label></div><Btn className="w-full mt-4" disabled={busy||!sel.length} onClick={make}>{busy?'Writing questions…':'Create room'}</Btn></>:<Empty icon="📚" t="Upload a lecture to host a battle." cta="Upload lecture" on={()=>go({n:'lectures'})}/>}</Card>
<Card><h2 className="font-serif text-2xl font-bold mb-3">Join with a code</h2><input className={inp+' text-center text-2xl font-mono tracking-[.3em] uppercase'} maxLength="5" value={code} onChange={x=>setCode(x.target.value)} placeholder="ABCDE"/><Btn className="w-full mt-4" disabled={code.length<5} onClick={join}>Join room</Btn></Card></div><Err m={e}/></div>}

function Room({code,go}){const[s,setS]=useState(),[e,setE]=useState(''),[res,setRes]=useState({}),[now,setNow]=useState(Date.now()),got=useRef(Date.now()),names=useRef([]),fin=useRef(false);
useEffect(()=>{let on=true;const p=async()=>{try{const d=await api('/battles/'+code);if(!on)return;got.current=Date.now();const nm=d.board.map(x=>x.name);names.current.length&&nm.filter(x=>!names.current.includes(x)).forEach(x=>toast(x+' joined the room'));names.current=nm;if(d.status==='finished'&&!fin.current){fin.current=true;toast('Battle finished. Final rankings are in!')}setS(d)}catch(x){setE(x.message)}};p();const a=setInterval(p,1500),b=setInterval(()=>setNow(Date.now()),200);return()=>{on=false;clearInterval(a);clearInterval(b)}},[code]);
if(e)return <div><Err m={e}/><Btn v="s" onClick={()=>go({n:'battle'})}>Back</Btn></div>;if(!s)return <Load/>;
const el=(now-got.current)/1000,left=Math.max(0,s.left-el),starts=Math.max(0,s.starts_in-el),r=res[s.idx],med=['🥇','🥈','🥉'];
const pick=async j=>{try{const x=await api('/battles/'+code+'/answer',{body:{idx:s.idx,answer:j}});setRes({...res,[s.idx]:{pick:j,...x}})}catch(z){toast(z.message,'err')}};
const start=async()=>{try{await api('/battles/'+code+'/start',{body:{}})}catch(z){toast(z.message,'err')}};
const Board=<Card className="h-fit"><h3 className="font-semibold mb-3">{s.status==='finished'?'Final rankings':'Live leaderboard'}</h3>{s.board.map((p,i)=><div key={p.user_id} className={cx('flex items-center gap-2 py-2 px-2 rounded-lg text-sm',p.user_id===s.me&&'bg-cobalt/10 font-semibold')}><span className="w-7">{med[i]||i+1}</span><span className="flex-1 truncate">{p.name}</span><span>{p.score}</span></div>)}</Card>;
return <div className="fade grid lg:grid-cols-[1fr_18rem] gap-4"><Card>
<p className="text-sm opacity-70 mb-1">{s.title}</p>
{s.status==='lobby'&&<div className="text-center py-6"><p className="text-sm opacity-70">Room code</p><p className="font-mono text-5xl font-bold tracking-[.3em] my-3">{s.code}</p><Btn v="s" onClick={()=>navigator.clipboard.writeText(s.code).then(()=>toast('Code copied'),()=>toast('Copy failed. Select the code instead.','err'))}>Copy code</Btn><p className="text-sm mt-5">{s.board.length} player{s.board.length>1?'s':''} in the room · {s.total} questions · {s.per_q}s each</p>{s.host?<Btn className="mt-4" onClick={start}>Start battle</Btn>:<p className="mt-4 opacity-70">Waiting for the host to start…</p>}</div>}
{s.status==='running'&&starts>0&&<div className="text-center py-16"><p className="opacity-70">Get ready</p><p className="font-serif text-8xl font-bold text-cobalt">{Math.ceil(starts)}</p></div>}
{s.status==='running'&&starts<=0&&s.question&&<div><div className="flex justify-between text-sm mb-2"><span>Question {s.idx+1} of {s.total}</span><span className={cx('font-mono text-lg font-semibold',left<5&&'text-mark')}>{Math.ceil(left)}s</span></div><div className="h-1.5 rounded bg-slate-200 dark:bg-slate-800 mb-5"><div className="h-full rounded bg-cobalt" style={{width:left/s.per_q*100+'%'}}/></div><h2 className="font-serif text-xl font-bold mb-4">{s.question.q}</h2>
{s.question.options.map((o,j)=>{const done=r||s.answered;return <button key={j} disabled={!!done} onClick={()=>pick(j)} className={cx('w-full text-left rounded-xl border px-4 py-3 mb-2 transition',r&&j===r.right?'border-pass bg-pass/10':r&&j===r.pick?'border-mark bg-mark/10':'border-slate-300 dark:border-slate-700 hover:border-cobalt')}>{o}</button>})}
{(r||s.answered)&&<p className="text-sm mt-2 font-semibold">{(r||s.answered).correct?`Correct! +${(r||s.answered).points} points`:'Not this time.'} Waiting for the next question…</p>}</div>}
{s.status==='finished'&&<div className="text-center py-8"><p className="text-5xl">{med[0]}</p><p className="font-serif text-2xl font-bold mt-2">{s.board[0]?.name} wins!</p><p className="opacity-70 text-sm mt-1">Your rank: #{s.board.findIndex(p=>p.user_id===s.me)+1} of {s.board.length}</p><Btn className="mt-5" onClick={()=>go({n:'battle'})}>New battle</Btn></div>}
</Card>{Board}</div>}

function About(){return <div className="fade max-w-3xl space-y-4"><Card className="text-center py-10"><div className="flex justify-center mb-4"><Logo s={72}/></div><h1 className="font-serif text-4xl font-bold">ExamGenius AI</h1><p className="mt-3 opacity-80 max-w-prose mx-auto leading-relaxed">ExamGenius AI turns your own lecture files into realistic university exams, grades them, explains every answer like a professor, and shows you exactly where to improve. Every question comes only from the material you upload.</p></Card>
<Card><dl className="grid sm:grid-cols-[10rem_1fr] gap-y-3 text-sm"><dt className="opacity-60">Founder &amp; Developer</dt><dd className="font-semibold">MOSTAFA ALSHIKH ALI</dd><dt className="opacity-60">Project</dt><dd className="font-semibold">ExamGenius AI</dd><dt className="opacity-60">Field</dt><dd className="font-semibold">Artificial Intelligence &amp; Software Development</dd><dt className="opacity-60">Built with</dt><dd>React, Tailwind CSS, Chart.js, Flask, SQLite and the OpenAI API</dd></dl></Card>
<Card><h2 className="font-semibold mb-2">What you can do</h2><ul className="list-disc ml-5 text-sm space-y-1"><li>Generate timed exams or untimed practice from any lecture, with four professor styles</li><li>Combine several lectures into one final exam simulation</li><li>Find your weak topics and get a personalized practice quiz</li><li>Compete with friends in private Study Battle rooms</li><li>Prepare with a guide to the concepts your lecture emphasizes</li></ul></Card></div>}

const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function Exam({exam,go}){const Q=exam.questions,prac=exam.mode==='practice',ar=exam.lang==='Arabic';
const[i,setI]=useState(0),[ans,setAns]=useState({}),[flag,setFlag]=useState({}),[fb,setFb]=useState({}),[ex,setEx]=useState({}),[left,setLeft]=useState(exam.duration*60),[conf,setConf]=useState(false),[busy,setBusy]=useState(false),[err,setErr]=useState('');
const t0=useRef(Date.now()),b=useRef(false);
useEffect(()=>{if(prac)return;const t=setInterval(()=>setLeft(l=>l-1),1000);return()=>clearInterval(t)},[]);
useEffect(()=>{if(!prac&&left<=0)submit()},[left]);
const submit=async()=>{if(b.current)return;b.current=true;setBusy(true);setErr('');setConf(false);try{const r=await api('/exams/'+exam.id+'/submit',{body:{answers:ans,seconds:Math.round((Date.now()-t0.current)/1000)}});go({n:'result',id:r.id})}catch(x){setErr(x.message);b.current=false;setBusy(false)}};
const q=Q[i],a=ans[i],set=v=>setAns({...ans,[i]:v}),done=Object.values(ans).filter(v=>v!==''&&v!=null&&!(Array.isArray(v)&&!v.some(Boolean))).length;
const check=async()=>{try{setFb({...fb,[i]:await api('/exams/'+exam.id+'/check',{body:{index:i,answer:a}})})}catch(x){setErr(x.message)}};
const explain=async()=>{try{const d=await api('/explain',{body:{lecture_id:q.lecture_id||exam.lecture_id,text:q.q}});setEx({...ex,[i]:d.explanation})}catch(x){setErr(x.message)}};
const opt=(sel,on,t)=><button key={t} onClick={on} className={cx('w-full text-left rounded-xl border px-4 py-3 mb-2 transition',sel?'border-cobalt bg-cobalt/10':'border-slate-300 dark:border-slate-700 hover:border-cobalt')}>{t}</button>;
return <div className="fade grid lg:grid-cols-[1fr_16rem] gap-4" dir={ar?'rtl':'ltr'}>
<Card><div className="flex justify-between items-center mb-2 text-sm"><span>Question {i+1} of {Q.length}</span>{prac?<span className="opacity-70">Practice mode</span>:<span className={cx('font-mono text-lg font-semibold',left<60&&'text-mark')} dir="ltr">{fmt(Math.max(left,0))}</span>}</div>
<div className="h-1.5 rounded bg-slate-200 dark:bg-slate-800 mb-5"><div className="h-full rounded bg-cobalt transition-all" style={{width:done/Q.length*100+'%'}}/></div>
<p className="text-xs opacity-60 mb-1">{q.topic}</p><h2 className="font-serif text-xl font-bold mb-4 whitespace-pre-wrap">{q.q}</h2>
{q.type==='mcq'&&q.options.map((o,j)=>opt(a===j,()=>set(j),o))}
{q.type==='tf'&&['true','false'].map(o=>opt(a===o,()=>set(o),o==='true'?'True':'False'))}
{q.type==='fill'&&<input className={inp} value={a||''} onChange={e=>set(e.target.value)} placeholder="Type the missing word or phrase"/>}
{q.type==='match'&&q.left.map((l,j)=><div key={j} className="flex gap-3 items-center mb-2"><span className="flex-1">{l}</span><select className={inp+' flex-1 dark:bg-[#111A33]'} value={(a||[])[j]||''} onChange={e=>{const n=[...(a||[])];n[j]=e.target.value;set(n)}}><option value="">Choose…</option>{q.right.map(r=><option key={r}>{r}</option>)}</select></div>)}
{(q.type==='short'||q.type==='scenario')&&<textarea rows="6" className={inp} value={a||''} onChange={e=>set(e.target.value)} placeholder="Write your answer"/>}
{fb[i]&&<div className={cx('mt-4 rounded-xl p-4 text-sm border',fb[i].score>=.5?'border-pass bg-pass/10':'border-mark bg-mark/10')}><b>{fb[i].score>=.5?'Correct':'Not quite'}</b> · Answer: {fb[i].correct}<p className="mt-1">{fb[i].comment||fb[i].explanation}</p><p className="opacity-60 mt-1">{fb[i].reference}</p></div>}
{ex[i]&&<div className="mt-3 rounded-xl p-4 text-sm bg-cobalt/10">{ex[i]}</div>}<Err m={err}/>
<div className="flex flex-wrap gap-2 mt-5"><Btn v="s" disabled={i===0} onClick={()=>setI(i-1)}>Previous</Btn><Btn v="s" disabled={i===Q.length-1} onClick={()=>setI(i+1)}>Next</Btn>
{!prac&&<Btn v="s" onClick={()=>setFlag({...flag,[i]:!flag[i]})}>{flag[i]?'Unmark review':'Mark for review'}</Btn>}
{prac&&<><Btn disabled={a==null||a===''||fb[i]} onClick={check}>Check answer</Btn><Btn v="s" onClick={explain}>Explain this concept</Btn></>}
<Btn className="ml-auto" disabled={busy} onClick={()=>setConf(true)}>{prac?'Finish':'Submit exam'}</Btn></div></Card>
<Card className="h-fit"><h3 className="font-semibold mb-3">Questions</h3><div className="grid grid-cols-5 gap-2">{Q.map((_,j)=><button key={j} onClick={()=>setI(j)} className={cx('aspect-square rounded-lg text-sm font-semibold border',j===i?'border-cobalt ring-2 ring-cobalt':'border-transparent',flag[j]?'bg-amber-400 text-black':ans[j]!=null&&ans[j]!==''?'bg-cobalt text-white':'bg-slate-200 dark:bg-slate-800')}>{j+1}</button>)}</div><p className="text-xs opacity-70 mt-3">Blue: answered · Amber: marked · Grey: open</p><p className="text-sm mt-2">{done}/{Q.length} answered</p></Card>
{conf&&<div className="fixed inset-0 bg-black/50 grid place-items-center p-4 z-50" dir="ltr"><Card className="max-w-sm"><h3 className="font-serif text-xl font-bold">{prac?'Finish practice?':'Submit your exam?'}</h3><p className="text-sm my-3">You answered {done} of {Q.length} questions{Object.values(flag).some(Boolean)?` and marked ${Object.values(flag).filter(Boolean).length} for review`:''}. You can't change answers after submitting.</p><div className="flex gap-2 justify-end"><Btn v="s" onClick={()=>setConf(false)}>Keep working</Btn><Btn onClick={submit}>Submit</Btn></div></Card></div>}
{busy&&<div className="fixed inset-0 bg-black/50 grid place-items-center z-50 text-white font-semibold">Your professor is grading…</div>}</div>}

function Result({id,go}){const[r,setR]=useState(),[e,setE]=useState('');useEffect(()=>{api('/attempts/'+id).then(d=>setR(d.attempt)).catch(x=>setE(x.message))},[id]);const sc=useCount(r?r.score:0);
if(e)return <Err m={e}/>;if(!r)return <Load/>;const o=r.overall,L=(t,a,c)=>a?.length?<div><h3 className={'font-semibold '+c}>{t}</h3><ul className="list-disc ml-5 text-sm">{a.map(x=><li key={x}>{x}</li>)}</ul></div>:null,col=r.score>=50?'#14804A':'#D6293E',msg=r.score>=85?'Outstanding':r.score>=70?'Strong work':r.score>=50?'Pass. Keep revising':'Needs more revision';
return <div className="fade space-y-4"><H>{r.title}</H>
<Card className="flex flex-wrap items-center gap-6"><div className="w-32 h-32 rounded-full grid place-items-center" style={{background:`conic-gradient(${col} ${sc*3.6}deg,#cbd5e133 0)`}}><div className="w-24 h-24 rounded-full bg-white dark:bg-[#111A33] grid place-items-center font-serif text-3xl font-bold">{Math.round(sc)}</div></div>
<div className="text-sm space-y-1"><p className="font-serif text-2xl font-bold" style={{color:col}}>{msg}</p><p>{r.score}% · {Math.round(r.score)}/100</p><p>{r.correct} correct · {r.total-r.correct} incorrect · {r.total} questions</p><p>Time taken: {fmt(r.seconds)}</p></div></Card>
<div className="grid md:grid-cols-2 gap-4"><Card><h2 className="font-semibold mb-2">Professor's feedback</h2><div className="space-y-3">{L('Strong areas',o.strong,'text-pass')}{L('Weak areas',o.weak,'text-mark')}{L('Needs revision',o.revise,'')}{L('Study recommendations',o.tips,'text-cobalt')}</div></Card><Card><h2 className="font-semibold mb-2">By topic</h2><Chart_ type="bar" data={ds(r.topics.map(t=>t.topic),r.topics.map(t=>t.pct))} options={{indexAxis:'y',scales:{x:{min:0,max:100}}}}/></Card></div>
{r.lectures&&r.lectures.length>1&&<Card><h2 className="font-semibold mb-2">Performance by lecture</h2><Chart_ type="bar" data={ds(r.lectures.map(t=>t.lecture.slice(0,24)),r.lectures.map(t=>t.pct),'#14804A')} options={y100}/></Card>}
<Card><h2 className="font-semibold mb-3">Question review</h2>{r.review.map((x,i)=><div key={i} className="py-4 border-t border-slate-200 dark:border-slate-800 text-sm"><p><b className={x.score>=.5?'text-pass':'text-mark'}>{i+1}. {x.score>=.999?'Correct':x.score>=.5?'Partly correct':'Incorrect'}</b> <span className="opacity-60">· {x.topic}{x.lecture?' · '+x.lecture:''}</span></p><p className="my-1 whitespace-pre-wrap">{x.q}</p><p>Your answer: {x.student}</p><p>Correct answer: {x.correct}</p><p className="mt-1">{x.comment||x.explanation}</p><p className="opacity-60">Lecture reference: {x.reference}</p></div>)}</Card>
<div className="flex gap-2"><Btn onClick={()=>go({n:'analytics'})}>See analytics</Btn><Btn v="s" onClick={()=>go({n:'weakness'})}>Find my weak spots</Btn></div></div>}

function Analytics({go}){const[s,setS]=useState();useEffect(()=>{api('/stats').then(setS)},[]);if(!s)return <Load/>;if(!s.total)return <div><H>Analytics</H><Card><Empty icon="📊" t="Complete an exam to unlock analytics."/></Card></div>;
const weak=s.by_topic.filter(t=>t.pct<60).slice(0,6);
return <div className="fade space-y-4"><H>Analytics</H><div className="grid sm:grid-cols-3 gap-4"><Card><p className="text-sm opacity-70">Improvement</p><p className={cx('font-serif text-3xl font-bold',s.improvement>=0?'text-pass':'text-mark')}>{s.improvement==null?'—':(s.improvement>0?'+':'')+s.improvement+'%'}</p></Card><Card><p className="text-sm opacity-70">Strongest topic</p><p className="font-semibold">{s.strongest.topic} ({s.strongest.pct}%)</p></Card><Card><p className="text-sm opacity-70">Weakest topic</p><p className="font-semibold">{s.weakest.topic} ({s.weakest.pct}%)</p></Card></div>
<div className="grid lg:grid-cols-2 gap-4"><Card><h2 className="font-semibold mb-2">Scores over time</h2><Chart_ type="line" data={ds(s.series.map(x=>x.date),s.series.map(x=>x.score))} options={y100}/></Card><Card><h2 className="font-semibold mb-2">By lecture</h2><Chart_ type="bar" data={ds(s.by_lecture.map(x=>x.title.slice(0,22)),s.by_lecture.map(x=>x.avg),'#14804A')} options={y100}/></Card></div>
<Card><h2 className="font-semibold mb-2">By topic</h2><Chart_ type="bar" data={ds(s.by_topic.map(x=>x.topic.slice(0,24)),s.by_topic.map(x=>x.pct),'#D6293E')} options={y100}/></Card>
{weak.length>0&&<Card><h2 className="font-semibold mb-2">Practice your weak topics</h2>{weak.map(t=><div key={t.topic} className="flex justify-between items-center py-2 border-b border-slate-200 dark:border-slate-800"><span>{t.topic} <b className="text-mark">{t.pct}%</b></span><Btn v="s" onClick={()=>go({n:'lecture',id:t.lecture_id,topics:[t.topic]})}>Generate questions</Btn></div>)}</Card>}</div>}

function App(){const[u,setU]=useState(),[ready,setReady]=useState(false),[v,setV]=useState({n:'dash'}),[dark,setDark]=useState(T.dark!=='0');
useEffect(()=>{document.documentElement.classList.toggle('dark',dark);T.dark=dark?1:0},[dark]);
useEffect(()=>{(T.tk?api('/me').then(d=>setU(d.user)).catch(()=>T.removeItem('tk')):Promise.resolve()).finally(()=>{setReady(true);const s=document.getElementById('splash');if(s)setTimeout(()=>{s.style.opacity=0;setTimeout(()=>s.remove(),600)},1300)})},[]);
if(!ready)return null;if(!u)return <><Auth onLogin={x=>{setU(x);setV({n:'dash'});toast('Welcome, '+x.name.split(' ')[0]+'!')}}/><Toasts/></>;
const nav=[['dash','Dashboard'],['lectures','Lectures'],['final','Final exam'],['weakness','Weakness detector'],['battle','Study Battle'],['analytics','Analytics'],['about','About']];
const on=k=>v.n===k||(k==='lectures'&&['lecture','prep'].includes(v.n))||(k==='battle'&&v.n==='room');
const page={dash:<Dash user={u} go={setV}/>,lectures:<Lectures go={setV}/>,lecture:<Lecture key={v.id+String(v.topics)} id={v.id} topics={v.topics} go={setV}/>,prep:<Prep id={v.id} go={setV}/>,final:<Final go={setV}/>,weakness:<Weak go={setV}/>,battle:<Battle go={setV}/>,room:<Room key={v.code} code={v.code} go={setV}/>,exam:v.exam&&<Exam key={v.exam.id} exam={v.exam} go={setV}/>,result:<Result id={v.id} go={setV}/>,analytics:<Analytics go={setV}/>,about:<About/>}[v.n];
return <div className="min-h-screen md:flex"><aside className="md:w-60 md:min-h-screen p-4 bg-[#101A33] text-white flex md:flex-col gap-1 flex-wrap items-center md:items-stretch"><div className="mr-auto md:mr-0 md:mb-6"><Brand/></div>
{nav.map(([k,t])=><button key={k} onClick={()=>setV({n:k})} className={cx('text-left rounded-lg px-3 py-2 text-sm transition',on(k)?'bg-white/15 font-semibold':'hover:bg-white/10')}>{t}</button>)}
<div className="md:mt-auto text-xs space-y-2 w-full"><p className="opacity-70 truncate">{u.name} · {u.email}</p><div className="flex gap-2"><button className="rounded-lg border border-white/30 px-2 py-1" onClick={()=>setDark(!dark)}>{dark?'Light mode':'Dark mode'}</button><button className="rounded-lg border border-white/30 px-2 py-1" onClick={()=>{T.removeItem('tk');setU(null)}}>Log out</button></div></div></aside>
<main className="flex-1 min-w-0 p-4 md:p-8 max-w-6xl w-full"><div key={v.n+(v.id||v.code||(v.exam&&v.exam.id)||'')} className="fade">{page}</div><Footer/></main><Toasts/></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
